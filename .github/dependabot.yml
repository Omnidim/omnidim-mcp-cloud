version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One PR per week, not one per package. Packages that have to move
      # together fail by construction when split. Majors are grouped too but
      # kept apart, so one major cannot hold the routine bumps back.
      python-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      python-major:
        patterns: ["*"]
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    groups:
      docker:
        patterns: ["*"]
