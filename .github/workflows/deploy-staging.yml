name: Deploy staging

# A push to the staging branch tests, builds and pushes one mcp-cloud image (tag = commit sha) to the staging
# account's ECR, then deploys it to the staging box (container `mcp-cloud`; deploy.sh runs alembic first).
# Same shape as OmniOP's staging deploy; the box side is omni-infra staging/ (deploy.sh, compose.yml,
# deploy-roles.yaml). AWS access is the short-lived role github-deploy-staging-mcp-cloud, which only the
# "staging" environment (staging branch) can use.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time; a newer commit waits for the running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  BOX: i-0297d96cde2dddb67
  IMAGE: 559852958069.dkr.ecr.ap-south-1.amazonaws.com/staging/mcp-cloud:${{ github.sha }}

jobs:
  deploy:
    runs-on: codebuild-omnidim-build-${{ github.run_id }}-${{ github.run_attempt }}
    environment: staging
    env:
      DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni_mcp
      PUBLIC_BASE_URL: http://localhost:8000
      DASHBOARD_BASE_URL: http://localhost:3000
      ODOO_INTERNAL_BASE_URL: http://localhost:8069
      # Must match the literal in tests/conftest.py (alembic loads Settings before conftest runs).
      ODOO_INTERNAL_SHARED_SECRET: test-shared-secret
      TOKEN_SIGNING_KEY: ci-signing-key-padded-to-32-bytes!!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Plain docker, not a services: block, so it runs the same on the CodeBuild runner.
      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=omni -e POSTGRES_PASSWORD=omni \
            -e POSTGRES_DB=omni_mcp postgres:16-alpine
          for _ in $(seq 1 30); do docker exec pg pg_isready -U omni && exit 0; sleep 1; done
          docker logs pg
          exit 1
      # The exact commit that deploys is tested here; a red test means no image.
      - run: uv sync --locked --extra dev
      - run: uv run ruff check . && uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Build
        run: docker build -t mcp-cloud:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://invalid/db \
            -e PUBLIC_BASE_URL -e DASHBOARD_BASE_URL -e ODOO_INTERNAL_BASE_URL \
            -e ODOO_INTERNAL_SHARED_SECRET=smoke -e TOKEN_SIGNING_KEY=smoke-signing-key-padded-to-32-bytes \
            mcp-cloud:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      # Only now take the deploy role, so installs and tests never hold it.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push (tags are immutable; a re-run skips an existing one)
        run: |
          if aws ecr describe-images --repository-name staging/mcp-cloud --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "staging/mcp-cloud:$GITHUB_SHA already in ECR"
          else
            docker tag mcp-cloud:ci "$IMAGE"
            docker push "$IMAGE"
          fi
      - name: Deploy on the staging box
        run: |
          id=$(aws ssm send-command --instance-ids "$BOX" --document-name staging-deploy-mcp-cloud \
            --parameters "tag=$GITHUB_SHA" --comment "mcp-cloud $GITHUB_SHA run $GITHUB_RUN_ID" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          # deploy.sh runs migrations, then waits 30 s of health: allow 20 min like the document's timeout.
          for _ in $(seq 1 240); do
            st=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$BOX" --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$BOX" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Status: $st"
          test "$st" = Success
