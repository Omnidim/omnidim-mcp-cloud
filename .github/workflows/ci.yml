name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni_mcp
      PUBLIC_BASE_URL: http://localhost:8000
      DASHBOARD_BASE_URL: http://localhost:3000
      ODOO_INTERNAL_BASE_URL: http://localhost:8069
      # Must match the literal in tests/conftest.py — alembic loads Settings
      # before conftest runs, so this can't just be "whatever conftest sets".
      ODOO_INTERNAL_SHARED_SECRET: test-shared-secret
      TOKEN_SIGNING_KEY: ci-signing-key-padded-to-32-bytes!!

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: omnidim-mcp-cloud:ci
      - name: Smoke test the image
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL=postgresql+asyncpg://invalid/db \
            -e PUBLIC_BASE_URL=http://localhost:8000 \
            -e DASHBOARD_BASE_URL=http://localhost:3000 \
            -e ODOO_INTERNAL_BASE_URL=http://localhost:8069 \
            -e ODOO_INTERNAL_SHARED_SECRET=smoke \
            -e TOKEN_SIGNING_KEY=smoke-signing-key-padded-to-32-bytes \
            -p 8000:8000 \
            omnidim-mcp-cloud:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

  # Build and push the tagged image on a GitHub-hosted runner so the prod
  # box never builds; the deploy job only has it pull and restart.
  publish:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/omnidim/omnidim-mcp-cloud:${{ github.ref_name }}
            ghcr.io/omnidim/omnidim-mcp-cloud:latest

  # The role this job assumes can only run one deploy command, for one tag, on
  # one host. The migrate, restart, readiness and rollback steps live on the host.
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-1
      INSTANCE_ID: ${{ secrets.MCP_DEPLOY_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name mcp-cloud-deploy \
            --parameters "tag=$TAG" --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          while [ "$status" = Pending ] || [ "$status" = InProgress ] || [ "$status" = Delayed ] || [ "$status" = Cancelling ]; do
            sleep 10
            # InvocationDoesNotExist is normal for a few seconds after send-command; any other error is real.
            if ! out=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>&1); then
              case "$out" in *InvocationDoesNotExist*) out=Pending ;; *) echo "$out" >&2; exit 1 ;; esac
            fi
            status=$out
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "Status: $status"
          [ "$status" = Success ]
