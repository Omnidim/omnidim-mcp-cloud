name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omni_mcp
      PUBLIC_BASE_URL: http://localhost:8000
      DASHBOARD_BASE_URL: http://localhost:3000
      ODOO_INTERNAL_BASE_URL: http://localhost:8069
      # Must match the literal in tests/conftest.py — alembic loads Settings
      # before conftest runs, so this can't just be "whatever conftest sets".
      ODOO_INTERNAL_SHARED_SECRET: test-shared-secret
      TOKEN_SIGNING_KEY: ci-signing-key-padded-to-32-bytes!!

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: omnidim-mcp-cloud:ci
      - name: Smoke test the image
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL=postgresql+asyncpg://invalid/db \
            -e PUBLIC_BASE_URL=http://localhost:8000 \
            -e DASHBOARD_BASE_URL=http://localhost:3000 \
            -e ODOO_INTERNAL_BASE_URL=http://localhost:8069 \
            -e ODOO_INTERNAL_SHARED_SECRET=smoke \
            -e TOKEN_SIGNING_KEY=smoke-signing-key-padded-to-32-bytes \
            -p 8000:8000 \
            omnidim-mcp-cloud:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

  # Keeps the release PR current. Merging that PR makes this job tag and
  # create the GitHub release, which unlocks publish and the prod deploy below.
  release:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Build and push the tagged image on a GitHub-hosted runner so the prod
  # box never builds; the deploy job only has it pull and restart.
  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/omnidim/omnidim-mcp-cloud:${{ needs.release.outputs.tag }}
            ghcr.io/omnidim/omnidim-mcp-cloud:latest

  # The production environment only accepts v* tags, and a tag created by this
  # workflow's token starts no new run, so hand the deploy to deploy.yml on the
  # tag itself. workflow_dispatch is the one event that token may start.
  start-deploy:
    runs-on: ubuntu-latest
    needs: [release, publish]
    if: needs.release.outputs.created == 'true'
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
